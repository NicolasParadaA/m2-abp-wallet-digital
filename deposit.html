<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Depositar</title>
    <!-- CSS DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- SCRIPT DE BOOTSTRAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/js/validaLogin.js"></script>
    <script src="./assets/js/logica_global.js"></script>
    <script defer src="./assets/js/deposit.js"></script>
</head>

<body class="deposit-page text-start">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row justify-content-center col-xl-5 col-lg-5 col-md-6 col-sm-6 col-5">
            <div class="glass-container">
                <h1 class="glass-title">Depositar</h1>
                <form id="form-deposit">
                    <div class="form-group py-2">
                        <label for="depositAmount" class="pb-1 glass-text">Monto a depositar:</label>
                        <input type="number" class="form-control glass-input text-white" id="depositAmount" placeholder="Ingrese Monto"
                            min="1">
                    </div>
                    <button type="submit" class="btn btn-primary mt-2 glass-button">Realizar depósito</button>
                    <a href="./menu.html" class="btn btn-secondary mt-2 glass-button">Voler al Menú Principal</a>
                    <section class="py-2">
                        <h3 class="glass-money">Saldo: $ <span id="monto-saldo"></span></h3>
                    </section>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
