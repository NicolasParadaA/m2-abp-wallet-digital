<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Login</title>
    <!-- CSS DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- SCRIPT DE BOOTSTRAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script defer src="./assets/js/index.js"></script>
</head>

<body class="login-page text-start">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row justify-content-center col-xl-4 col-lg-4 col-md-4 col-sm-5 col-4">
            <div class="glass-container">
                <h1 class="glass-title">Login</h1>
                <form id="form-login">
                    <div class="form-group py-2">
                        <label for="email" class="py-1 glass-text"> Ingrese Email:</label>
                        <input type="email" class="form-control glass-input" id="email" placeholder="Email" required
                            value="admin@admin.cl">
                    </div>
                    <div class="form-group">
                        <label for="password" class="py-1 glass-text">Contraseña:</label>
                        <input type="password" class="form-control glass-input" id="password" placeholder="Contraseña"
                            required value="123456">
                    </div>
                    <button type="submit" class="btn btn-primary mt-3 glass-button">Ingresar</button>
                    <button class="btn btn-secondary mt-3 glass-button">Olvidaste la Contraseña?</button>
                    <a href="./menu.html" class="btn btn-warning mt-3 d-none glass-button" id="link-menu">Menú</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
