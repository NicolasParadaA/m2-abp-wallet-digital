<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Login</title>
    <!-- CSS DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- SCRIPT DE BOOTSTRAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- Font Awesome icons -->
    <script defer src="https://kit.fontawesome.com/98167611cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script defer src="./assets/js/index.js"></script>
</head>

<body class="login-page text-start">
    <div class="card-container"> <!-- contenedor que centra la tarjeta en la pantalla -->
        <div class="credit-card"> <!-- tarjeta con display: grid -->
            <p class="name-product">Product Wallet</p>
            <div class="chip-wrapper">
                <div class="chip"></div> 
                <div><i class="fa-solid fa-wifi fa-rotate-90 contactless"></i></div>
            </div> <!-- chip de tarjeta -->
            <div class="brand"></div> <!-- logo visa o mastercard -->
            <form id="form-login"> <!-- formulario -->
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control">

                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control">

                <button type="submit" class="btn btn-primary mt-5">Ingresar</button>
            </form>
        </div>
    </div>
</body>

</html>
