<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Menú Principal</title>
    <!-- CSS DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- SCRIPT DE BOOTSTRAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/js/validaLogin.js"></script>
    <script src="./assets/js/logica_global.js"></script>
    <script defer src="./assets/js/menu.js"></script>
</head>

<body class="menu-page">
    <!-- Header cerrar sesion -->
    <header class="d-flex justify-content-between align-items-center px-4 py-3 text-white">
        <span class="fw-bold">Product Wallet</span>
        <a href="#" onclick="cerrarSesion(); return false;" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
    </header>

    <div class="container py-4">
        <!-- tarjeta saldo -->
        <div class="balance-card">
            <p class="mb-1 text-white-50">Saldo disponible</p>
            <h2 class="text-white fw-bold">$ <span id="monto-saldo"></span></h2>
        </div>
        <!-- grid de acciones -->
        <div class="row g-3 mt-4">
            <div class="col-md-4 col-12">
                <a href="./deposit.html" class="action-card action-deposit text-center text-white">
                    <div class="action-icon">💳</div>
                    <div class="action-title">Depositar</div>
                    <div class="action-subtitle">Fondos</div>
                </a>
            </div>
            <div class="col-md-4 col-12">
                <a href="./sendmoney.html" class="action-card action-send text-center text-white">
                    <div class="action-icon">✈️</div>
                    <div class="action-title">Enviar</div>
                    <div class="action-subtitle">Dinero</div>
                </a>
            </div>
            <div class="col-md-4 col-12">
                <a href="./transactions.html" class="action-card action-history text-center text-white">
                    <div class="action-icon">📊</div>
                    <div class="action-title">Últimos</div>
                    <div class="action-subtitle">Movimientos</div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
