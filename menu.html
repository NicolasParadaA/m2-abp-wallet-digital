<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Menú Principal</title>
    <!-- CSS DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- SCRIPT DE BOOTSTRAP -->

        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/js/validaLogin.js"></script>
    <script src="./assets/js/logica_global.js"></script>
    <script defer src="./assets/js/menu.js"></script>
</head>

<body class="menu-page text-start">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="glass-container">
                    <h1 class="mx-0 px-0 glass-title">Menú Principal</h1>
                    <div class="form-group mx-0 px-0">
                        <label for="balance" class="glass-text">Dinero en cuenta:</label>
                        <div class="saldo-wrapper">
                            <div class="glass-money">
                                <h3>$<span id="monto-saldo"></span></h3>
                            </div>
                        </div>
                    </div>
                    <a href="./deposit.html" class="btn btn-primary my-2 glass-button" id="link-deposit">Depositar</a>
                    <a href="./sendmoney.html" class="btn btn-primary my-2 glass-button" id="link-sendmoney">Enviar
                        Dinero</a>
                    <a href="./transactions.html" class="btn btn-primary my-2 glass-button"
                        id="link-transactions">Últimos
                        Movimientos</a>
                    <div class="py-3 text-center">
                        <p id="mensaje-redireccion" class="fw-bold glass-text"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
