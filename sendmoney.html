<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Enviar Dinero</title>
    <!-- CSS DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- SCRIPT DE BOOTSTRAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- SCRIPT DE JQquery -->
    <script defer src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/js/validaLogin.js"></script>
    <script src="./assets/js/logica_global.js"></script>
    <script defer src="./assets/js/sendmoney.js"></script>
</head>

<body class="sendmoney-page d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6">
        <div class="container">
            <div class="glass-container">
                <h1 class="glass-title">Enviar Dinero</h1>
                <form>
                    <div class="form-group">
                        <label for="searchcontact" class="glass-text">Buscar en la agenda de transferencias:</label>
                        <input type="text" class="form-control glass-input text-white" id="searchContact" placeholder="Buscar Contacto">
                    </div>
                    <button type="button" class="btn btn-primary mt-2 glass-button" data-bs-toggle="modal"
                        data-bs-target="#modalAgregarContacto" data-bs-dimiss="modal">Agregar nuevo contacto</button>
                    <h2 class="glass-title">Contactos</h2>
                    <ul id="contactList" class="list-group mb-3">
                        <!-- AQUÍ SE AGREGARAN LOS CONTACTOS DE FORMA DINÁMICA -->
                    </ul>
                    <button type="button" class="btn btn-primary mt-2 glass-button" data-bs-toggle="modal"
                        data-bs-target="#modalEnviarDinero">Enviar Dinero</button>
                </form>
                <a href="./menu.html" class="btn btn-secondary mt-2 glass-button">Volver al Menú Principal</a>
            </div>
        </div>

        <!-- INCIO MODAL AGREGAR NUEVO CONTACTO -->
        <div class="modal fade" id="modalAgregarContacto" tabindex="-1" aria-labelledby="modalAgregarContacto"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalAgregarContacto">Agregar Nuevo Contacto</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="formAddContacto">
                            <div class="mb-2">
                                <label for="nombre" class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-2">
                                <label for="apellido" class="form-label">Apellido:</label>
                                <input type="text" class="form-control" id="apellido" required>
                            </div>
                            <div class="mb-2">
                                <label for="cbu" class="form-label">CBU:</label>
                                <input type="number" class="form-control" id="cbu" required>
                            </div>
                            <div class="mb-2">
                                <label for="alias" class="form-label">Alias:</label>
                                <input type="text" class="form-control" id="alias" required>
                            </div>
                            <div class="mb-2">
                                <label for="banco" class="form-label">Nombre Banco:</label>
                                <input type="text" class="form-control" id="banco" required>
                            </div>
                            <div class="mb-2">
                                <button type="submit" class="btn btn-success">Agregar Contacto</button>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- INICIO MODAL ENVIAR DINERO -->
        <div class="modal fade" id="modalEnviarDinero" tabindex="-1" aria-labelledby="modalEnviarDineroLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEnviarDineroLabel">Enviar dinero</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p class="fs-2">Saldo cuenta: <span class="outputSaldo"></span></p>
                        <form id="formEnviarDinero">
                            <div class="mb-3">
                                <label for="enviarContacto" class="form-label">Seleccionar contacto:</label>
                                <select name="enviarContacto" id="enviarContacto" class="form-control">
                                    <option value="">Contacto 1</option>
                                    <option value="">Contacto 2</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="enviarMonto" class="form-label">Monto: </label>
                                <input type="number" class="form-control" min="1000" value="1000" id="enviarMonto"
                                    name="enviarMonto">
                            </div>
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary">Enviar</button>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
